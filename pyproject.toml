[project]
name = "clicue"
version = "0.1.48"

description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rapidfuzz", "vosk", "sounddevice", "rich", "faster-whisper"]

[project.scripts]
clicue = "clicue.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/clicue", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/clicue"]

[dependency-groups]
dev = [
    "verkit",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["var-annotated", "import-untyped", "assignment", "arg-type", "type-arg", "override", "misc"]


